<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#073b2b">

    <title>Wedding Invitation | Welcome</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           1. RESPONSIVE DESIGN SYSTEM
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green: #073b2b;
            --dark-green: #04271e;
            --gold: #d6b46a;
            --light-gold: #f0dfad;
            --cream: #fff8e9;

            --page-padding: clamp(14px, 4vw, 40px);
            --card-padding: clamp(20px, 5vw, 48px);
        }

        html {
            width: 100%;
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            font-family: 'Montserrat', sans-serif;
            background: var(--dark-green);
            color: var(--cream);

            overflow-x: hidden;

            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        button {
            font: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================
           2. FULL-SCREEN WELCOME PAGE
        ========================================= */

        .welcome-page {
            position: relative;

            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            padding:
                max(var(--page-padding), env(safe-area-inset-top))
                var(--page-padding)
                max(var(--page-padding), env(safe-area-inset-bottom));

            display: flex;
            align-items: center;
            justify-content: center;

            isolation: isolate;
            overflow: hidden;

            background:
                radial-gradient(
                    ellipse at 50% 45%,
                    rgba(24, 92, 66, 0.55) 0%,
                    transparent 65%
                ),
                linear-gradient(
                    145deg,
                    #0b4935 0%,
                    #073b2b 48%,
                    #03251b 100%
                );
        }

        /* =========================================
           3. BACKGROUND EFFECTS
        ========================================= */

        .ambient-light {
            position: absolute;

            width: min(90vw, 700px);
            aspect-ratio: 1;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: radial-gradient(
                circle,
                rgba(214, 180, 106, 0.09),
                transparent 70%
            );

            animation: ambientPulse 8s ease-in-out infinite;

            pointer-events: none;
            z-index: -1;
        }

        .pattern {
            position: absolute;
            inset: 0;

            opacity: 0.055;
            pointer-events: none;

            background-image:
                repeating-linear-gradient(
                    45deg,
                    transparent 0,
                    transparent 39px,
                    var(--gold) 40px,
                    transparent 41px,
                    transparent 79px
                ),
                repeating-linear-gradient(
                    -45deg,
                    transparent 0,
                    transparent 39px,
                    var(--gold) 40px,
                    transparent 41px,
                    transparent 79px
                );

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );
        }

        /* =========================================
           4. DECORATIVE CORNERS
        ========================================= */

        .corner {
            position: absolute;

            width: clamp(36px, 8vw, 100px);
            height: clamp(36px, 8vw, 100px);

            border-color: rgba(214, 180, 106, 0.55);
            border-style: solid;
            border-width: 0;

            pointer-events: none;

            opacity: 0;
            animation: cornerAppear 1.2s ease forwards;
        }

        .top-left {
            top: max(12px, env(safe-area-inset-top));
            left: 12px;
            border-top-width: 1px;
            border-left-width: 1px;
        }

        .top-right {
            top: max(12px, env(safe-area-inset-top));
            right: 12px;
            border-top-width: 1px;
            border-right-width: 1px;
            animation-delay: 0.15s;
        }

        .bottom-left {
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 12px;
            border-bottom-width: 1px;
            border-left-width: 1px;
            animation-delay: 0.3s;
        }

        .bottom-right {
            bottom: max(12px, env(safe-area-inset-bottom));
            right: 12px;
            border-bottom-width: 1px;
            border-right-width: 1px;
            animation-delay: 0.45s;
        }

        /* =========================================
           5. CENTRAL INVITATION CARD
        ========================================= */

        .welcome-card {
            position: relative;
            z-index: 2;

            width: 100%;
            max-width: 520px;

            padding: var(--card-padding);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            text-align: center;

            border: 1px solid rgba(214, 180, 106, 0.4);

            background: linear-gradient(
                160deg,
                rgba(255, 255, 255, 0.025),
                rgba(0, 0, 0, 0.07)
            );

            box-shadow:
                0 0 50px rgba(0, 0, 0, 0.12),
                inset 0 0 35px rgba(214, 180, 106, 0.025);

            opacity: 0;
            transform: translateY(18px);

            animation: contentAppear 1.1s ease forwards;
        }

        /* =========================================
           6. ORNAMENTS
        ========================================= */

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;
            margin-bottom: clamp(18px, 4vh, 30px);

            flex-shrink: 0;
        }

        .diamond {
            width: 9px;
            height: 9px;

            background: var(--gold);
            transform: rotate(45deg);
        }

        .ornament-line {
            width: clamp(30px, 8vw, 48px);
            height: 1px;

            background: linear-gradient(
                to right,
                transparent,
                var(--gold)
            );
        }

        .ornament-line:last-child {
            transform: rotate(180deg);
        }

        /* =========================================
           7. ASSALAMUALAIKUM
        ========================================= */

        .greeting {
            font-family: 'Amiri', serif;

            font-size: clamp(27px, 5vw, 43px);
            line-height: 1.65;

            color: var(--light-gold);

            margin-bottom: clamp(18px, 4vh, 36px);

            text-shadow:
                0 2px 18px rgba(214, 180, 106, 0.12);

            overflow-wrap: anywhere;
        }

        /* =========================================
           8. MAIN HEADING
        ========================================= */

        .welcome-title {
            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(34px, 7vw, 53px);
            font-weight: 400;

            line-height: 1.12;
            letter-spacing: clamp(0.3px, 0.2vw, 1px);

            color: var(--cream);

            margin-bottom: clamp(14px, 3vh, 20px);

            max-width: 100%;
            overflow-wrap: break-word;
        }

        /* =========================================
           9. WEDDING MESSAGE
        ========================================= */

        .welcome-description {
            font-family: 'Cormorant Garamond', serif;

            font-size: clamp(19px, 3.8vw, 25px);
            font-weight: 400;

            line-height: 1.55;
            letter-spacing: 0.4px;

            color: var(--light-gold);

            max-width: 100%;

            margin-bottom: clamp(22px, 4vh, 38px);
        }

        /* =========================================
           10. BUTTON
        ========================================= */

        .open-button {
            width: min(100%, 260px);
            min-height: 54px;

            padding: 15px 18px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            border: 1px solid var(--gold);
            border-radius: 0;

            background: transparent;
            color: var(--light-gold);

            font-family: 'Montserrat', sans-serif;
            font-size: clamp(9px, 1.8vw, 11px);
            font-weight: 500;

            letter-spacing: clamp(1px, 0.3vw, 2px);

            cursor: pointer;

            touch-action: manipulation;

            transition:
                background 0.3s ease,
                color 0.3s ease,
                box-shadow 0.3s ease,
                transform 0.3s ease;
        }

        .open-button:hover {
            background: var(--gold);
            color: var(--dark-green);

            box-shadow:
                0 0 25px rgba(214, 180, 106, 0.16);

            transform: translateY(-2px);
        }

        .open-button:active {
            transform: scale(0.98);
        }

        .open-button:focus-visible {
            outline: 2px solid var(--cream);
            outline-offset: 5px;
        }

        .open-button:disabled {
            cursor: wait;
            opacity: 0.8;
        }

        .button-arrow {
            font-size: 17px;
            transition: transform 0.3s ease;
        }

        .open-button:hover .button-arrow {
            transform: translateX(5px);
        }

        /* =========================================
           11. FOOTER
        ========================================= */

        .bottom-label {
            position: absolute;

            bottom: max(22px, env(safe-area-inset-bottom));
            left: 0;

            width: 100%;

            padding: 0 15px;

            text-align: center;

            font-size: clamp(7px, 1.2vw, 9px);
            letter-spacing: clamp(1.5px, 0.3vw, 3px);

            color: rgba(255, 248, 233, 0.5);

            pointer-events: none;
        }

        /* =========================================
           12. PAGE TRANSITION
        ========================================= */

        .transition-overlay {
            position: fixed;
            inset: 0;

            background: var(--cream);

            z-index: 1000;

            pointer-events: none;
            visibility: hidden;

            transform: translateY(100%);
        }

        .transition-overlay.active {
            visibility: visible;

            animation: pageTransition 0.8s
                cubic-bezier(0.77, 0, 0.175, 1)
                forwards;
        }

        /* =========================================
           13. ANIMATIONS
        ========================================= */

        @keyframes contentAppear {
            from {
                opacity: 0;
                transform: translateY(18px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cornerAppear {
            to {
                opacity: 1;
            }
        }

        @keyframes ambientPulse {
            0%, 100% {
                opacity: 0.65;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes pageTransition {
            0% {
                transform: translateY(100%);
            }

            45% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-100%);
            }
        }

        /* =========================================
           14. SMALL PHONES
        ========================================= */

        @media (max-width: 360px) {
            .welcome-page {
                --page-padding: 12px;
                --card-padding: 20px;
            }

            .welcome-card {
                max-width: 100%;
            }

            .greeting {
                font-size: 28px;
            }

            .welcome-title {
                font-size: clamp(31px, 9vw, 36px);
            }

            .welcome-description {
                font-size: 19px;
            }

            .open-button {
                min-height: 50px;
                padding: 13px 10px;
            }
        }

        /* =========================================
           15. TABLETS
        ========================================= */

        @media (min-width: 600px) {
            .welcome-card {
                max-width: 540px;
                padding: clamp(35px, 6vw, 55px);
            }

            .welcome-title {
                font-size: clamp(45px, 6vw, 58px);
            }
        }

        /* =========================================
           16. LAPTOPS AND DESKTOPS
        ========================================= */

        @media (min-width: 1024px) {
            .welcome-card {
                max-width: 560px;
            }

            .welcome-title {
                font-size: 58px;
            }

            .greeting {
                font-size: 43px;
            }
        }

        /* =========================================
           17. LANDSCAPE PHONES AND SHORT SCREENS
        ========================================= */

        @media (max-height: 600px) {
            .welcome-page {
                padding-top: 30px;
                padding-bottom: 40px;
            }

            .welcome-card {
                padding: 18px 24px;
            }

            .ornament {
                margin-bottom: 12px;
            }

            .greeting {
                font-size: clamp(24px, 5vh, 32px);
                margin-bottom: 12px;
            }

            .welcome-title {
                font-size: clamp(29px, 6vh, 39px);
                margin-bottom: 10px;
            }

            .welcome-description {
                font-size: clamp(17px, 3.5vh, 21px);
                margin-bottom: 16px;
            }

            .open-button {
                min-height: 44px;
                padding: 10px 16px;
            }

            .bottom-label {
                bottom: 8px;
            }
        }

        /* =========================================
           18. REDUCED MOTION ACCESSIBILITY
        ========================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="welcome-page">

        <!-- Background -->
        <div class="pattern" aria-hidden="true"></div>
        <div class="ambient-light" aria-hidden="true"></div>

        <!-- Decorative corners -->
        <div class="corner top-left" aria-hidden="true"></div>
        <div class="corner top-right" aria-hidden="true"></div>
        <div class="corner bottom-left" aria-hidden="true"></div>
        <div class="corner bottom-right" aria-hidden="true"></div>

        <!-- Main welcome card -->
        <section class="welcome-card">

            <!-- Top ornament -->
            <div class="ornament" aria-hidden="true">
                <span class="ornament-line"></span>
                <span class="diamond"></span>
                <span class="ornament-line"></span>
            </div>

            <!-- Assalamualaikum -->
            <p class="greeting" lang="ar" dir="rtl">
                السَّلَامُ عَلَيْكُمْ
            </p>

            <!-- Main heading -->
            <h1 class="welcome-title">
                You Are<br>
                Cordially Invited
            </h1>

            <!-- Wedding message -->
            <p class="welcome-description">
                Two Hearts,<br>
                One Beautiful Journey.
            </p>

            <!-- Button -->
            <button
                class="open-button"
                id="openInvitation"
                type="button"
                aria-label="Open the wedding invitation"
            >
                <span>OPEN INVITATION</span>
                <span class="button-arrow" aria-hidden="true">→</span>
            </button>

            <!-- Bottom ornament -->
            <div class="ornament" aria-hidden="true" style="margin-top: clamp(20px, 4vh, 38px); margin-bottom: 0;">
                <span class="ornament-line"></span>
                <span class="diamond"></span>
                <span class="ornament-line"></span>
            </div>

        </section>

        <!-- Footer -->
        <p class="bottom-label">
            WITH GRATITUDE &amp; PRAYERS
        </p>

    </main>

    <!-- Transition overlay -->
    <div
        class="transition-overlay"
        id="transitionOverlay"
        aria-hidden="true"
    ></div>

    <script>
        /* PAGE 1 NAVIGATION */

        const openButton = document.getElementById("openInvitation");
        const transitionOverlay = document.getElementById("transitionOverlay");

        openButton.addEventListener("click", function () {

            if (openButton.disabled) {
                return;
            }

            openButton.disabled = true;

            transitionOverlay.classList.add("active");

            // Navigate to Page 2
            setTimeout(function () {
                window.location.href = "page2.html";
            }, 550);

        });
    </script>

</body>
</html>
